<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Vishnu ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            text-align: center;
            color: white;
            z-index: 10;

            font-size: 24px;
            line-height: 1.6;

            opacity: 0;
            animation: showMessage 3s ease-in-out forwards;
            animation-delay: 2s;

            text-shadow: 0 0 10px #fff,
                         0 0 20px #ff69b4,
                         0 0 30px #ff1493;
        }

        .name {
            font-size: 38px;
            font-weight: bold;
            color: #ff69b4;
            display: block;
            margin-bottom: 15px;

            animation: heartbeat 1.5s infinite;
        }

        .success {
            display: block;
            margin-top: 15px;
            color: #ffd700;
            font-weight: bold;
        }

        @keyframes showMessage {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @media (max-width: 600px) {
            .message {
                font-size: 18px;
            }

            .name {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <canvas id="heartCanvas"></canvas>

    <div class="message">

        <span class="name">
            Vishnu ❤️
        </span>

        To my best friend,<br>

        Thank you for being my bestest friend forever. ❤️<br>

        I love you Vishnu! 🫶🏻

        <span class="success">
            Let's work together and get success! ✨
        </span>

    </div>

    <script>

        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        // Create heart points
        function heart(t) {

            const x = 16 * Math.pow(Math.sin(t), 3);

            const y = -(13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t));

            return {
                x: x * 20,
                y: y * 20
            };
        }

        // Create colorful particles
        for (let i = 0; i < 500; i++) {

            let t = Math.random() * Math.PI * 2;

            let p = heart(t);

            particles.push({

                x: canvas.width / 2,
                y: canvas.height / 2,

                targetX: canvas.width / 2 + p.x,
                targetY: canvas.height / 2 + p.y,

                color: `hsl(${Math.random() * 360}, 100%, 65%)`,

                size: Math.random() * 3 + 1,

                speed: Math.random() * 0.03 + 0.01
            });
        }

        function animate() {

            ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {

                p.x += (p.targetX - p.x) * p.speed;
                p.y += (p.targetY - p.y) * p.speed;

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = p.color;
                ctx.fill();

            });

            requestAnimationFrame(animate);
        }

        animate();

        // Resize
        window.addEventListener("resize", () => {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        });

    </script>

</body>
</html>
