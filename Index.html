<!DOCTYPE html>
<html>
<head>
    <title>Nanna ❤️</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            font-family: "Segoe Script", "Comic Sans MS", cursive;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: black;
        }
    </style>
</head>

<body>

<div id="container">
    <canvas id="heart" width="1000" height="800"></canvas>
</div>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const colors = [
    "#ff1493",
    "#ff4d6d",
    "#ff69b4",
    "#ff0000",
    "#ff8c00",
    "#ffff00",
    "#00ff7f",
    "#00ffff",
    "#00bfff",
    "#7c4dff",
    "#d946ef"
];

const centerX = 500;
const centerY = 390;

let drawingAngle = 0;
let heartFinished = false;

let textProgress = 0;
let finalAnimation = false;

let pulse = 0;
let sparkle = 0;


// --------------------------------------------------
// HEART FORMULA
// --------------------------------------------------

function getHeartPoint(t) {

    let x = 16 * Math.pow(Math.sin(t), 3);

    let y =
        -(13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t));

    return {
        x: x * 19,
        y: y * 19
    };
}


// --------------------------------------------------
// MESSAGE
// --------------------------------------------------

const messages = [
    "Nanna ❤️",
    "you are one who always special to me",
    "I always stay your side",
    "I will always love youuu",
    "I promise youuuu",
    "I never leave youuu",
    "I LOVE YOU KANNAYA ❤️"
];


// --------------------------------------------------
// DRAW HEART
// --------------------------------------------------

function drawHeart() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ----------------------------------------------
    // HEART LINES
    // ----------------------------------------------

    for (let i = 0; i < drawingAngle; i += 2) {

        let t = i * Math.PI / 180;

        let point = getHeartPoint(t);

        let color =
            colors[Math.floor(Math.random() * colors.length)];

        ctx.beginPath();

        ctx.moveTo(centerX, centerY);

        ctx.lineTo(
            centerX + point.x,
            centerY + point.y
        );

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        ctx.shadowBlur = 5;
        ctx.shadowColor = color;

        ctx.stroke();

        // Small dots on heart border

        ctx.beginPath();

        ctx.arc(
            centerX + point.x,
            centerY + point.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = color;

        ctx.shadowBlur = 10;
        ctx.shadowColor = color;

        ctx.fill();
    }


    ctx.shadowBlur = 0;


    // ----------------------------------------------
    // HEART DRAWING ANIMATION
    // ----------------------------------------------

    if (!heartFinished) {

        drawingAngle += 3;

        if (drawingAngle >= 360) {

            drawingAngle = 360;

            heartFinished = true;

            // Start text animation
            setTimeout(() => {
                startTextAnimation();
            }, 500);
        }
    }


    // ----------------------------------------------
    // TEXT
    // ----------------------------------------------

    if (heartFinished) {

        drawText();
    }


    // ----------------------------------------------
    // FINAL GLOWING ANIMATION
    // ----------------------------------------------

    if (finalAnimation) {

        drawSparkles();

        pulse += 0.05;

        let glow =
            15 + Math.sin(pulse) * 8;

        ctx.save();

        ctx.globalAlpha =
            0.25 + Math.sin(pulse) * 0.08;

        ctx.strokeStyle = "#ff1493";

        ctx.lineWidth = 3;

        ctx.shadowBlur = glow;

        ctx.shadowColor = "#ff1493";

        drawHeartOutline();

        ctx.restore();
    }


    requestAnimationFrame(drawHeart);
}


// --------------------------------------------------
// TEXT ANIMATION
// --------------------------------------------------

function startTextAnimation() {

    let currentLine = 0;

    const textTimer = setInterval(() => {

        currentLine++;

        textProgress = currentLine;

        if (currentLine >= messages.length) {

            clearInterval(textTimer);

            setTimeout(() => {

                finalAnimation = true;

            }, 1000);
        }

    }, 700);
}


// --------------------------------------------------
// DRAW MESSAGE
// --------------------------------------------------

function drawText() {

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let i = 0; i < textProgress; i++) {

        let y;

        if (messages.length === 7) {

            y = 230 + i * 48;
        }

        let fontSize;

        if (i === 0) {
            fontSize = 42;
        }
        else if (i === 6) {
            fontSize = 32;
        }
        else {
            fontSize = 23;
        }

        ctx.font =
            `bold ${fontSize}px "Segoe Script", "Comic Sans MS", cursive`;

        let color =
            colors[i % colors.length];

        ctx.fillStyle = color;

        ctx.shadowBlur = 15;

        ctx.shadowColor = color;

        ctx.fillText(
            messages[i],
            centerX,
            y
        );

        ctx.shadowBlur = 0;
    }
}


// --------------------------------------------------
// HEART OUTLINE
// --------------------------------------------------

function drawHeartOutline() {

    ctx.beginPath();

    for (let i = 0; i <= 360; i++) {

        let t = i * Math.PI / 180;

        let point = getHeartPoint(t);

        let x = centerX + point.x;
        let y = centerY + point.y;

        if (i === 0) {
            ctx.moveTo(x, y);
        }
        else {
            ctx.lineTo(x, y);
        }
    }

    ctx.stroke();
}


// --------------------------------------------------
// SPARKLES
// --------------------------------------------------

function drawSparkles() {

    sparkle++;

    for (let i = 0; i < 20; i++) {

        let angle =
            (i * 18 + sparkle) * Math.PI / 180;

        let radius = 320;

        let x =
            centerX +
            Math.cos(angle) * radius;

        let y =
            centerY +
            Math.sin(angle) * radius * 0.7;

        let size =
            2 + Math.sin(sparkle * 0.05 + i) * 2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            colors[i % colors.length];

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            colors[i % colors.length];

        ctx.fill();
    }

    ctx.shadowBlur = 0;
}


// --------------------------------------------------
// START
// --------------------------------------------------

drawHeart();

</script>

</body>
</html>
